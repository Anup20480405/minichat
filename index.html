<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2677e8"><title>MiniChat v3</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#eef3fa;color:#172b46}header{background:#2677e8;color:white;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;font-weight:700;font-size:21px}main{max-width:690px;margin:auto;padding:14px}.panel{background:#fff;padding:15px;border-radius:16px;margin-bottom:12px;box-shadow:0 2px 12px #183c7612}h3{font-size:16px;margin:2px 0 10px}input,button{font:inherit;border-radius:11px;padding:11px}input{width:100%;min-width:0;border:1px solid #ccd7e6}button{border:0;background:#2677e8;color:#fff;font-weight:600;cursor:pointer}button.secondary{background:#e6eefc;color:#1b5ac1}button.danger{background:#fbe8e7;color:#a52f2f}button:disabled{opacity:.5}.row{display:flex;align-items:center;gap:8px}.row>*{min-width:0}.grow{flex:1}.help{font-size:12px;color:#64748b;line-height:1.5}.hidden{display:none!important}#status{font-size:13px;color:#a33629;white-space:pre-wrap;min-height:20px}.roomItem,.memberItem{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #e8edf4}.roomItem:last-child,.memberItem:last-child{border:0}.small{font-size:12px;color:#64748b}.roomButton{max-width:100%;text-align:left;background:#eaf2ff;color:#173a6c}#messages{min-height:245px;height:46dvh;overflow-y:auto;padding:10px;border-radius:12px;background:#f5f8fc;display:flex;flex-direction:column;gap:10px}.bubble{max-width:87%;align-self:flex-start;border-radius:13px;background:#fff;padding:10px 12px;overflow-wrap:anywhere;white-space:pre-wrap}.bubble.mine{align-self:flex-end;background:#d5e8ff}.meta,.receipt{font-size:11px;color:#53667b;margin-bottom:4px}.receipt{margin:5px 0 0;text-align:right;color:#2369af}.photo{max-width:100%;height:auto;border-radius:8px;display:block;max-height:290px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#9aa8b8;margin-right:5px}.dot.online{background:#1aaf5d}#sendForm{display:flex;gap:7px;margin-top:9px;align-items:center}#message{flex:1}#photo{display:none}.uploadLabel{display:inline-flex;align-items:center;justify-content:center;background:#e7efff;color:#1b5ac1;border-radius:11px;padding:11px;cursor:pointer}.tag{display:inline-block;background:#e9f6ee;color:#197340;padding:3px 7px;border-radius:999px;font-size:11px}.adminRow{display:flex;gap:5px;flex-wrap:wrap}.adminRow button{font-size:12px;padding:7px}#members{margin-top:6px}
</style>
</head><body>
<header>💬 MiniChat <span style="font-size:12px;opacity:.85">v3</span></header><main>
<section class="panel"><label for="name">あなたの表示名 / Your name</label><input id="name" maxlength="24" placeholder="例：はるか" autocomplete="nickname"><p class="help">名前はこの端末に保存されます。</p></section>
<section class="panel" id="lobby"><h3>💬 Chat List</h3><div id="roomList" class="help">読み込み中...</div><p class="help">新しいチャットを作るか、友達の招待リンクから参加してね。</p><button id="create">＋ 新しいチャットを作成</button></section>
<section class="panel hidden" id="chat"><div class="row" style="flex-wrap:wrap"><button id="back" class="secondary">← Chat List</button><button id="share" class="secondary">招待リンクを共有</button><span id="ownerBadge" class="tag hidden">Admin</span></div><h3 id="roomTitle" style="margin-top:12px">Chat</h3><div id="presence" class="help">参加者を読み込み中...</div><p class="help">✓✓ Seen はメッセージが相手の画面に表示された目安です。厳密な既読確認ではありません。</p><div id="messages" aria-live="polite"></div><form id="sendForm"><label for="photo" class="uploadLabel" title="写真を送る">📷</label><input id="photo" type="file" accept="image/*"><input id="message" maxlength="1000" placeholder="メッセージを入力" autocomplete="off"><button id="send" type="submit">送信</button></form><p class="help">📷 写真は小さく圧縮してFirestoreに保存します。個人情報や機密写真は送らないでください。</p></section>
<section class="panel hidden" id="admin"><h3>🔐 Admin / Members</h3><div id="members"></div><div class="row" style="margin-top:10px;flex-wrap:wrap"><button id="rotate" class="secondary">招待リンクを更新</button><button id="close" class="danger">チャットを閉鎖</button></div><p class="help">Admin は作成者だけ。メンバーの削除・ブロック、メッセージ削除ができます。閉鎖してもデータは自動削除されません。</p></section>
<p id="status" role="status"></p>
</main>
<script type="module">
// Firebase Console > Project settings > Your apps > Config と照合してください。
const firebaseConfig = {
  apiKey: "AIzaSyAdf2g_PDHz9kDdd_8qddmKZwKYDWfKxmY",
  authDomain: "minichat4857.firebaseapp.com",
  projectId: "minichat4857",
  appId: "1:457604557349:web:fe18906c7966308ed1adcc"
};
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
import { getFirestore, doc, collection, setDoc, getDoc, updateDoc, deleteDoc, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";
const $ = id => document.getElementById(id);
const status = s => { $("status").textContent=s; };
const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
let uid="",roomId="",roomData=null, messages=[],readers=new Map(),members=new Map(),roomList=[];
let unsubs=[],unsubList=null,lastReadId="",activeTimer=null;
const refRoom=id=>doc(db,"rooms",id);
const refMember=(id,u)=>doc(db,"rooms",id,"members",u);
const refList=id=>doc(db,"userRooms",uid,"items",id);
const isOwner=()=>!!roomData && roomData.createdBy===uid;
const myName=()=>$("name").value.trim().slice(0,24)||"ゲスト";
const errText=e=>e?.message||String(e);
const safeId=id=>/^[0-9a-f-]{36}$/i.test(id||"");
const newSecret=()=>Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,"0")).join("");
$("name").value=localStorage.getItem("minichat-name")||"";
$("name").addEventListener("input",()=>localStorage.setItem("minichat-name",$("name").value.trim()));
function stopRoom(){unsubs.forEach(f=>f());unsubs=[];if(activeTimer)clearInterval(activeTimer);activeTimer=null;roomId="";roomData=null;messages=[];readers.clear();members.clear();lastReadId="";}
function back(){stopRoom();$("chat").classList.add("hidden");$("admin").classList.add("hidden");$("lobby").classList.remove("hidden");const url=new URL(location.href);url.searchParams.delete("room");url.searchParams.delete("invite");history.replaceState(null,"",url);status("");}
$("back").onclick=back;
function renderList(){const area=$("roomList");area.replaceChildren();if(!roomList.length){area.textContent="まだチャットがありません。";return;}for(const r of roomList){const wrap=document.createElement("div");wrap.className="roomItem";const b=document.createElement("button");b.className="roomButton";b.textContent=r.title||"Chat";b.onclick=()=>openRoom(r.id).catch(e=>status("開けませんでした。招待リンクから再参加してください: "+errText(e)));const del=document.createElement("button");del.className="secondary";del.textContent="一覧から削除";del.onclick=async()=>{if(!confirm("一覧から非表示にしますか？ チャット本体は削除されません。"))return;try{await deleteDoc(refList(r.id));}catch(e){status(errText(e));}};wrap.append(b,del);area.append(wrap);}}
function watchList(){if(unsubList)unsubList();unsubList=onSnapshot(collection(db,"userRooms",uid,"items"),snap=>{roomList=snap.docs.map(x=>({id:x.id,...x.data()}));renderList();},e=>status("Chat List: "+errText(e)));}
async function saveList(id,title){await setDoc(refList(id),{title:title||"Chat",updatedAt:serverTimestamp()});}
function renderMembers(){const area=$("members");area.replaceChildren();const online=Array.from(members.entries()).map(([id,d])=>({id,d,now:!!d.lastActive?.toMillis && Date.now()-d.lastActive.toMillis()<100000}));$("presence").replaceChildren();const span=document.createElement("span");span.textContent=online.map(x=>`${x.now?"🟢":"⚪"} ${x.d.name||"Guest"}`).join(" · ")||"参加者なし";$("presence").append(span);for(const x of online){const line=document.createElement("div");line.className="memberItem";const nm=document.createElement("span");nm.className="small";nm.textContent=`${x.now?"🟢":"⚪"} ${x.d.name||"Guest"}${x.id===uid?" (you)":""}`;line.append(nm);if(isOwner()&&x.id!==uid){const ban=document.createElement("button");ban.className="danger";ban.textContent="ブロック";ban.onclick=async()=>{if(!confirm("このユーザーをブロックしますか？"))return;try{await setDoc(doc(db,"rooms",roomId,"bans",x.id),{uid:x.id,bannedAt:serverTimestamp()});await deleteDoc(refMember(roomId,x.id));status("ブロックしました");}catch(e){status("ブロック失敗: "+errText(e));}};line.append(ban);}area.append(line);}}
function renderMessages(){const area=$("messages");area.replaceChildren();const allReaders=[...readers.entries()];for(const item of messages){const m=item.data(),mine=m.uid===uid,bubble=document.createElement("div");bubble.className="bubble"+(mine?" mine":"");const meta=document.createElement("div");meta.className="meta";meta.textContent=(m.name||"Guest")+(m.createdAt?.toDate?" · "+m.createdAt.toDate().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"}):"");bubble.append(meta);if(m.kind==="photo"&&typeof m.imageData==="string"&&/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(m.imageData)){const im=document.createElement("img");im.className="photo";im.alt="送信された写真";im.src=m.imageData;bubble.append(im);}else{const txt=document.createElement("div");txt.textContent=m.text||"";bubble.append(txt);}if(mine){const receipt=document.createElement("div");receipt.className="receipt";const sent=m.createdAt?.toMillis?.();const seen=!!sent&&allReaders.some(([rid,v])=>rid!==uid&&v.lastReadAt?.toMillis?.()>=sent);receipt.textContent=seen?"✓✓ Seen":"✓ Sent";bubble.append(receipt);}if(isOwner()){const del=document.createElement("button");del.className="danger";del.style.cssText="font-size:11px;padding:5px;margin-top:5px";del.textContent="削除";del.onclick=async()=>{if(!confirm("このメッセージを削除しますか？"))return;try{await deleteDoc(doc(db,"rooms",roomId,"messages",item.id));}catch(e){status(errText(e));}};bubble.append(del);}area.append(bubble);}area.scrollTop=area.scrollHeight;}
async function markRead(){if(!uid||!roomId||document.visibilityState!=="visible"||!messages.length)return;const last=messages.at(-1);if(!last.data().createdAt?.toMillis?.()||lastReadId===last.id)return;lastReadId=last.id;try{await setDoc(doc(db,"rooms",roomId,"readers",uid),{name:myName(),lastReadAt:serverTimestamp()});}catch(e){lastReadId="";status("Seen: "+errText(e));}}
async function heartbeat(){if(!uid||!roomId||document.visibilityState!=="visible")return;try{await updateDoc(refMember(roomId,uid),{lastActive:serverTimestamp(),name:myName()});}catch(e){/* blocked or offline; room snapshots will report access changes */}}
async function ensureOwnerUpgrade(id,room){if(room.createdBy!==uid)return room;if(!room.inviteCode){const secret=newSecret();await updateDoc(refRoom(id),{inviteCode:secret});return {...room,inviteCode:secret};}return room;}
async function join(id,secret){if(!/^[0-9a-f]{32}$/.test(secret||""))throw Error("有効な招待リンクが必要です");await setDoc(refMember(id,uid),{uid,name:myName(),joinCode:secret,joinedAt:serverTimestamp(),lastActive:serverTimestamp()});}
async function openRoom(id,secret=""){
 if(!safeId(id))throw Error("チャットIDが正しくありません");stopRoom();status("ルームに接続中...");
 let room;try{room=(await getDoc(refRoom(id))).data();}catch(e){if(!secret)throw Error("このルームの招待リンクが必要です。古いリンクの場合は作成者に新しいリンクをもらってください。");await join(id,secret);room=(await getDoc(refRoom(id))).data();}
 if(!room)throw Error("ルームが見つかりません");room=await ensureOwnerUpgrade(id,room);if(room.closed&&room.createdBy!==uid)throw Error("このルームは閉鎖されました");
 roomId=id;roomData=room;$("lobby").classList.add("hidden");$("chat").classList.remove("hidden");$("admin").classList.toggle("hidden",!isOwner());$("ownerBadge").classList.toggle("hidden",!isOwner());$("roomTitle").textContent=room.title||"Chat";
 const url=new URL(location.href);url.searchParams.set("room",id);url.searchParams.delete("invite");history.replaceState(null,"",url);
 // Owners need member records too for presence. Existing members keep their records.
 if(isOwner()){try{const own=await getDoc(refMember(id,uid));if(!own.exists()){await setDoc(refMember(id,uid),{uid,name:myName(),joinCode:room.inviteCode,joinedAt:serverTimestamp(),lastActive:serverTimestamp()});}}catch(e){status("Member: "+errText(e));}}
 try{await saveList(id,room.title||"Chat");}catch(e){status("Chat List: "+errText(e));}
 unsubs.push(onSnapshot(refRoom(id),s=>{if(roomId!==id)return;if(!s.exists()){status("このルームは削除されました");back();return;}roomData=s.data();$("admin").classList.toggle("hidden",!isOwner());$("ownerBadge").classList.toggle("hidden",!isOwner());$("roomTitle").textContent=roomData.title||"Chat";renderMessages();renderMembers();},e=>status("Room: "+errText(e))));
 unsubs.push(onSnapshot(collection(db,"rooms",id,"members"),s=>{if(roomId!==id)return;members=new Map(s.docs.map(d=>[d.id,d.data()]));renderMembers();},e=>status("Members: "+errText(e))));
 unsubs.push(onSnapshot(collection(db,"rooms",id,"readers"),s=>{if(roomId!==id)return;readers=new Map(s.docs.map(d=>[d.id,d.data()]));renderMessages();},e=>status("Seen: "+errText(e))));
 unsubs.push(onSnapshot(query(collection(db,"rooms",id,"messages"),orderBy("createdAt","asc"),limit(200)),s=>{if(roomId!==id)return;messages=s.docs;renderMessages();markRead();},e=>status("Messages: "+errText(e))));
 await heartbeat();activeTimer=setInterval(()=>{heartbeat();renderMembers();},45000);status("");
}
$("create").onclick=async()=>{if(!uid)return status("接続準備中です");$("create").disabled=true;const id=crypto.randomUUID(),secret=newSecret();try{await setDoc(refRoom(id),{createdBy:uid,createdAt:serverTimestamp(),title:"Chat",inviteCode:secret,closed:false});await openRoom(id);}catch(e){status("作成失敗: "+errText(e));}finally{$("create").disabled=false;}};
$("share").onclick=async()=>{if(!roomData?.inviteCode)return status("招待情報を確認できません");const url=new URL(location.href);url.searchParams.set("room",roomId);url.searchParams.set("invite",roomData.inviteCode);try{if(navigator.share)await navigator.share({title:"MiniChat に参加",url:url.href});else{await navigator.clipboard.writeText(url.href);status("招待リンクをコピーしました");}}catch(e){if(e.name!=="AbortError")prompt("このリンクをコピーして送ってください",url.href);}};
$("rotate").onclick=async()=>{if(!isOwner()||!confirm("招待リンクを変更しますか？ 以前のリンクで新しく参加できなくなります。"))return;try{await updateDoc(refRoom(roomId),{inviteCode:newSecret()});status("招待リンクを更新しました。共有ボタンから新しいリンクを送ってください");}catch(e){status(errText(e));}};
$("close").onclick=async()=>{if(!isOwner()||!confirm("このチャットを閉鎖しますか？ 他のメンバーはアクセスできなくなります。"))return;try{await updateDoc(refRoom(roomId),{closed:true});status("閉鎖しました。データはFirebaseに残ります。");}catch(e){status(errText(e));}};
$("sendForm").onsubmit=async ev=>{ev.preventDefault();const text=$("message").value.trim();if(!text||!roomId||!uid)return;$("send").disabled=true;try{await addDoc(collection(db,"rooms",roomId,"messages"),{uid,name:myName(),text,createdAt:serverTimestamp()});$("message").value="";status("");}catch(e){status("送信失敗: "+errText(e));}finally{$("send").disabled=false;}};
async function shrinkPhoto(file){if(!file.type.startsWith("image/"))throw Error("画像を選択してください");if(file.size>8*1024*1024)throw Error("元画像は8MB以下にしてください");const bmp=await createImageBitmap(file);try{let size=480,quality=.65;for(let t=0;t<6;t++){const scale=Math.min(1,size/Math.max(bmp.width,bmp.height));const canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(bmp.width*scale));canvas.height=Math.max(1,Math.round(bmp.height*scale));canvas.getContext("2d").drawImage(bmp,0,0,canvas.width,canvas.height);const data=canvas.toDataURL("image/jpeg",quality);if(data.length<=95000)return data;size=Math.round(size*.78);quality=Math.max(.35,quality-.07);}throw Error("写真が大きすぎます。小さな写真を選んでください");}finally{bmp.close?.();}}
$("photo").onchange=async()=>{const file=$("photo").files?.[0];if(!file||!roomId)return;$("photo").disabled=true;status("写真を圧縮しています...");try{const imageData=await shrinkPhoto(file);await addDoc(collection(db,"rooms",roomId,"messages"),{uid,name:myName(),text:"",kind:"photo",imageData,createdAt:serverTimestamp()});status("写真を送信しました");}catch(e){status("写真の送信失敗: "+errText(e));}finally{$("photo").value="";$("photo").disabled=false;}};
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){heartbeat();lastReadId="";markRead();renderMembers();}});
(async()=>{try{status("Firebaseに接続中...");uid=(await signInAnonymously(auth)).user.uid;watchList();const url=new URL(location.href),id=url.searchParams.get("room"),secret=url.searchParams.get("invite")||"";if(id)await openRoom(id,secret);else status("");}catch(e){status("接続エラー: "+errText(e));}})();
</script></body></html>
