<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2677e8"><title>MiniChat</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#eef3fa;color:#172b46}header{background:#2677e8;color:white;padding:calc(15px + env(safe-area-inset-top)) 16px 16px;font-size:21px;font-weight:700}main{max-width:680px;margin:auto;padding:16px}.panel{background:white;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 12px #183c7612}input,button{font:inherit;padding:12px;border-radius:12px}input{border:1px solid #ccd7e6;width:100%;min-width:0}button{border:0;background:#2677e8;color:white;font-weight:600}button:disabled{opacity:.45}button.secondary{background:#e5eefc;color:#1b5ac1}.controls{display:flex;gap:8px;margin-top:10px}.controls>*{flex:1}.help{font-size:13px;color:#66768d}#status{min-height:20px;color:#b34735;font-size:13px}#messages{height:48dvh;min-height:230px;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:12px;background:#f5f8fc;border-radius:12px}.bubble{background:#fff;padding:9px 12px;border-radius:14px;max-width:85%;align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap}.bubble.mine{background:#d5e8ff;align-self:flex-end}.meta{font-size:11px;color:#53667b;margin-bottom:4px}.hidden{display:none}#sendForm{display:flex;gap:8px;margin-top:10px}#sendForm input{flex:1}#sendForm button{flex-shrink:0}
</style>
</head>
<body>
<header>💬 MiniChat</header><main>
<section class="panel"><label for="name">あなたの表示名</label><input id="name" maxlength="24" placeholder="例：はるか" autocomplete="nickname"><p class="help">名前はこのiPhoneのブラウザに保存されます。</p></section>
<section class="panel" id="lobby"><button id="create">新しいチャットを作成</button><p class="help">友達から招待された場合は、届いたURLを開くだけで参加できます。</p></section>
<section class="panel hidden" id="chat"><div class="controls" style="margin-top:0"><button class="secondary" id="share">招待リンクを共有</button><button class="secondary" id="leave">退出</button></div><p class="help">招待リンクを知っている人は会話を見られます。リンクは信頼できる友達だけに送ってね。</p><div id="messages" aria-live="polite"></div><form id="sendForm"><input id="message" maxlength="1000" placeholder="メッセージを入力" autocomplete="off" required><button id="send" type="submit">送信</button></form></section>
<p id="status" role="status"></p>
</main>
<script type="module">
// ★ Firebaseコンソールの「ウェブアプリ設定」の値に置き換える

const firebaseConfig = {
　apiKey: "AIzaSyAdf2g_PDHz9kDdd_8qddmKZwKYDWfKxmY",
  authDomain: "minichat4857.firebaseapp.com",
  projectId: "minichat4857",
  appId: "1:457604557349:web:fe18906c7966308ed1adcc"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
import { getFirestore, doc, setDoc, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";
const $ = id => document.getElementById(id);
const status = text => { $("status").textContent = text; };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let uid = "", roomId = "", unsubscribe = null;
$("name").value = localStorage.getItem("minichat-name") || "";
$("name").addEventListener("input", () => localStorage.setItem("minichat-name", $("name").value.trim()));
function setRoom(id) {
  if (unsubscribe) { unsubscribe(); unsubscribe = null; }
  roomId = id;
  $("lobby").classList.toggle("hidden", !!id);
  $("chat").classList.toggle("hidden", !id);
  const url = new URL(location.href);
  if (id) url.searchParams.set("room", id); else url.searchParams.delete("room");
  history.replaceState(null, "", url);
  if (!id) return;
  status("メッセージを読み込み中...");
  const q = query(collection(db, "rooms", id, "messages"), orderBy("createdAt", "asc"), limit(200));
  unsubscribe = onSnapshot(q, snapshot => {
    $("messages").replaceChildren();
    snapshot.forEach(item => {
      const msg = item.data();
      const bubble = document.createElement("div");
      bubble.className = "bubble" + (msg.uid === uid ? " mine" : "");
      const meta = document.createElement("div"); meta.className = "meta";
      meta.textContent = (msg.name || "ゲスト") + (msg.createdAt?.toDate ? " · " + msg.createdAt.toDate().toLocaleTimeString("ja-JP", {hour:"2-digit",minute:"2-digit"}) : "");
      const body = document.createElement("div"); body.textContent = msg.text || "";
      bubble.append(meta, body); $("messages").append(bubble);
    });
    $("messages").scrollTop = $("messages").scrollHeight;
    status("");
  }, err => status("読み込みに失敗しました。招待リンクやFirestoreのルールを確認してください。"));
}
$("create").onclick = async () => {
  if (!uid) return status("接続準備中です。");
  const id = crypto.randomUUID();
  try { await setDoc(doc(db,"rooms",id), { createdBy: uid, createdAt: serverTimestamp() }); setRoom(id); }
  catch (e) { status("チャット作成失敗: " + e.message); }
};
$("share").onclick = async () => {
  const url = location.href;
  try { if (navigator.share) await navigator.share({title:"MiniChatに参加",url});
        else {await navigator.clipboard.writeText(url); status("招待リンクをコピーしました！");} }
  catch (e) { if (e.name !== "AbortError") prompt("このリンクをコピーして送ってください",url); }
};
$("leave").onclick = () => setRoom("");
$("sendForm").onsubmit = async e => {
  e.preventDefault(); const name = $("name").value.trim(), text = $("message").value.trim();
  if (!name) return status("先に表示名を入力してね。");
  if (!text || !roomId || !uid) return;
  $("send").disabled = true;
  try { await addDoc(collection(db,"rooms",roomId,"messages"), {name, text, uid, createdAt:serverTimestamp()}); $("message").value=""; status(""); }
  catch (err) { status("送信に失敗しました: " + err.message); }
  finally { $("send").disabled = false; }
};
(async () => {
  try {
    status("Firebaseに接続中...");
    uid = (await signInAnonymously(auth)).user.uid;
    const id = new URL(location.href).searchParams.get("room");
    if (id && /^[0-9a-f-]{36}$/i.test(id)) setRoom(id);
    else status("");
  } catch (err) { status("接続エラー：Firebaseの設定と匿名認証を確認してください。 " + err.message); }
})();
</script>
</body></html>
